<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda do Recomeço</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="game-shell">
    <header><p class="eyebrow">RPG • PIXEL ART</p><h1>Fazenda do Recomeço</h1><p>Transforme ruínas em um lar.</p></header>

      <div id="message" class="message" aria-live="polite"></div>

  </main>
  <script src="game.js"></script>
</body>
</html>
